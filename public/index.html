<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>메뉴판</title>
  <link rel="stylesheet" href="templates/board-grid.css">
  <link id="theme" rel="stylesheet" href="templates/cafe-dark.css">
  <script type="module" src="client.js"></script>
</head>
<body>
  <div class="stage">
    <div id="board" class="board">
      <div id="layer-bg" class="layer"></div>
      <main class="content">
        <header class="board-header">
          <p id="tagline" class="tagline" hidden></p>
          <h1 id="store-name" class="store-name"></h1>
        </header>
        <nav id="tabs" class="tabs" role="tablist"></nav>
        <section id="items" class="items"></section>
        <p id="empty" class="empty" hidden>표시할 메뉴가 없습니다.</p>
      </main>
      <div id="layer-frame" class="layer"></div>
    </div>
  </div>
</body>
</html>
